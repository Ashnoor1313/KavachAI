services:
  # FastAPI Backend Service
  - type: web
    name: kavach-backend
    env: python
    buildCommand: python -m pip install --upgrade pip && python -m pip install --default-timeout=100 --retries=5 -r backend/requirements.txt
    startCommand: python backend/run.py
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: backend
      - key: DEMO_SIMULATION_MODE
        value: false
      - key: DPDP_COMPLIANCE_MODE
        value: true
      - key: SYNTHETIC_DATA_ONLY
        value: true

  # Next.js Frontend Web App
  - type: web
    name: kavach-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npx next start -H 0.0.0.0 -p $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: NEXT_PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: kavach-backend
          property: host
